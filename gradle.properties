org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Configuration cache is left off: AppVersioning writes version.properties during
# configuration on assemble, which is incompatible with the configuration cache.

kotlin.code.style=official
kotlin.incremental=true
kotlin.caching.enabled=true

ksp.incremental=true
ksp.incremental.log=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
